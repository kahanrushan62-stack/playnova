
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlayNova - Free Online Games</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#0b1020;color:white}
header{padding:24px 16px;text-align:center;background:linear-gradient(135deg,#6d28d9,#2563eb)}
h1{margin:0;font-size:36px}
header p{margin:10px 0 0}
main{max-width:1000px;margin:auto;padding:22px 15px}
h2{margin-top:12px}
#search{width:100%;padding:14px;border:0;border-radius:12px;font-size:16px;margin:10px 0 22px}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:14px}
.game{background:#171f36;padding:20px 10px;border-radius:16px;text-align:center;border:1px solid #303b5b}
.game a{color:white;text-decoration:none;font-weight:bold;display:block}
.emoji{font-size:42px;display:block;margin-bottom:12px}
.game:hover{background:#28375c}
footer{text-align:center;color:#aab5d0;padding:25px}
</style>
</head>
<body>
<header>
<h1>🎮 PlayNova</h1>
<p>Your next favorite game is waiting!</p>
</header>
<main>
<h2>Explore Free Games</h2>
<input id="search" placeholder="🔍 Search games..." oninput="filterGames()">
<div class="games" id="games">
<div class="game"><a href="https://playsnake.org/" target="_blank"><span class="emoji">🐍</span>Snake</a></div>
<div class="game"><a href="https://play2048.co/" target="_blank"><span class="emoji">🔢</span>2048</a></div>
<div class="game"><a href="https://lichess.org/" target="_blank"><span class="emoji">♟️</span>Chess</a></div>
<div class="game"><a href="https://sudoku.com/" target="_blank"><span class="emoji">🧩</span>Sudoku</a></div>
<div class="game"><a href="https://www.solitaireparadise.com/" target="_blank"><span class="emoji">🃏</span>Solitaire</a></div>
<div class="game"><a href="https://minesweeper.online/" target="_blank"><span class="emoji">💣</span>Minesweeper</a></div>
<div class="game"><a href="https://tetris.com/play-tetris" target="_blank"><span class="emoji">🟪</span>Tetris</a></div>
<div class="game"><a href="https://pacman.live/" target="_blank"><span class="emoji">👾</span>Pac-Man</a></div>
</div>
</main>
<footer>© 2026 PlayNova · Play. Explore. Have fun!</footer>
<script>
function filterGames(){
let q=document.getElementById('search').value.toLowerCase();
document.querySelectorAll('.game').forEach(g=>{
g.style.display=g.innerText.toLowerCase().includes(q)?'block':'none';
});
}
</script>
</body>
</html>
